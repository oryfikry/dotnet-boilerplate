name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.300
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
          dotnet-quality: ga

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check for SQL literal booleans
        shell: pwsh
        run: |
          $matches = git grep -E '(= TRUE|= FALSE)' -- 'src/Api/Features/**/*.cs' 'src/Api/Infrastructure/**/*.cs'
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Found SQL literal TRUE/FALSE in code. Use parameterized predicates (@IsDeleted) for provider portability."
            exit 1
          }

      - name: Run integration tests
        env:
          # Testcontainers picks up the host docker daemon automatically.
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"
          retention-days: 14
